[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codestr"
version = "0.3.2"
description = "DSL → Polars Expr compile engine for quantitative factor mining"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "huangbogeng"},
]
keywords = ["quantitative-finance", "factor-mining", "expression-engine", "polars", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "polars>=1.44.1",
    "lark>=1.0,<2.0",
    "loguru>=0.7,<1.0",
    "toolz>=1.0,<2.0",
    "numpy>=1.26,<3.0",
]

[project.urls]
Repository = "https://github.com/huangbogeng/codestr"

[tool.hatch.build.targets.wheel]
packages = ["src/codestr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "TCH", # flake8-type-checking
]
ignore = [
    "RUF001",  # ambiguous fullwidth colon — idiomatic in Chinese
    "RUF002",  # ambiguous fullwidth comma — idiomatic in Chinese
    "RUF003",  # ambiguous fullwidth punctuation — idiomatic in Chinese
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = ["codestr[test]", "mypy>=1.10"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/codestr"]
omit = ["tests/*"]

[tool.ruff.format]
quote-style = "double"
